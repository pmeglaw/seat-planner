name: CI

# Runs on pull requests AND on every push to main. Merged-main coverage
# matters because pull_request-only leaves main unverified after a merge — a
# PR is tested against main as it stood before the merge, not the resulting
# tree, and a direct push to main gets no CI signal at all under
# pull_request-only.
#
# History: the push trigger was removed 2026-07-29 (#287) under free-plan
# minute pressure — Actions minutes are metered on this private repo, and a
# full run bills roughly 7.6 minutes across the three jobs (they run in
# parallel, but billing sums per job), and merges are squashes of a branch
# this workflow had just tested, so the extra run largely re-tested an
# identical tree. It was restored 2026-07-31 once the owner moved to GitHub
# Pro and Actions minutes stopped being a constraint.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test & coverage
        run: npm run coverage:check

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser download (~170MB). The uncached path has stalled on
      # CDN/apt slowness for 10+ minutes; on a hit only the apt deps install
      # runs, which is seconds when mirrors are healthy.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: SeatMap component tests
        run: npm run test:browser

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Authenticated flows (sign-in, the admin role gate, publish) against a
  # throwaway local Supabase stack. Separate from `e2e` so the fast, Docker-free
  # smoke tier still reports on its own, and so a Docker hiccup here can never
  # be mistaken for an app failure there.
  e2e-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same browser cache as the e2e job (see comment there).
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Applies supabase/migrations/* then supabase/seed.sql. Deliberately
      # `start` and never `db reset`: a reset gives the containers new IPs while
      # Kong keeps the old ones cached, which surfaces as a 502 from the auth
      # endpoint and looks like a broken login rather than stale routing.
      # Only the containers the auth suite touches: db, gotrue (auth), kong
      # (API gateway), postgrest, mailpit (SMTP is configured, so gotrue's
      # email paths need a sink). Everything else — studio, analytics
      # (logflare+vector, the slowest to boot), storage, realtime,
      # edge-runtime, imgproxy, postgres-meta, supavisor — is excluded; the
      # app uses none of them (no .storage/.channel/functions.invoke calls).
      - name: Start local Supabase stack
        run: npx supabase start -x studio,postgres-meta,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Wait for the auth endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')/auth/v1/health"; then
              echo "auth ready"; exit 0
            fi
            sleep 5
          done
          echo "auth endpoint never became ready"; exit 1

      # No build step: playwright-auth.config.ts builds the app itself with the
      # local stack's env. NEXT_PUBLIC_* is inlined at build time, so a build
      # made anywhere else would ship a bundle pointing at the wrong project.
      - name: Run authenticated e2e tests
        run: npm run test:e2e:auth

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth
          path: playwright-report/
          retention-days: 7
