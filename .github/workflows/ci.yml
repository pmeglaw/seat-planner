name: CI

# Runs on pull requests AND on every push to main. Merged-main coverage
# matters because pull_request-only leaves main unverified after a merge — a
# PR is tested against main as it stood before the merge, not the resulting
# tree, and a direct push to main gets no CI signal at all under
# pull_request-only.
#
# History: the push trigger was removed 2026-07-29 (#287) under free-plan
# minute pressure — Actions minutes are metered on this private repo, and a
# full run bills roughly 7.6 minutes across the three jobs (they run in
# parallel, but billing sums per job), and merges are squashes of a branch
# this workflow had just tested, so the extra run largely re-tested an
# identical tree. It was restored 2026-07-31 once the owner moved to GitHub
# Pro and Actions minutes stopped being a constraint.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN, declared once at the top level so every job
# inherits it (CodeQL's actions/missing-workflow-permissions flagged all three
# separately). Without a block, the token carries whatever the repo's default
# workflow permission is — a repo-settings value that can be widened later
# without touching this file, so the scope every run gets is pinned here
# instead. Nothing here needs more: the jobs check out, install, test, and
# upload artifacts (upload-artifact uses its own API, not repo contents), and
# no job pushes, comments, or publishes. A step that genuinely needs write
# opts THAT job back in with its own `permissions:` block rather than widening
# this one.
permissions:
  contents: read

# Every `uses:` is pinned to a full-length commit SHA with the human-readable
# version in a trailing comment. Repo Actions policy requires it ("Require
# actions to be pinned to a full-length commit SHA"), and a tag pin is mutable
# — `@v7` can be repointed at new code by the action's owner, so a SHA is what
# actually fixes what runs here. Tag pins fail at workflow STARTUP under this
# policy: the run is rejected before any job is scheduled, which shows up as a
# `startup_failure` with zero jobs and no logs rather than a normal red job
# (2026-08-09, run #529 on main).
#
# To bump one: resolve the tag to its commit and update BOTH the SHA and the
# comment — `git ls-remote https://github.com/actions/checkout 'refs/tags/v7^{}'`
# (the `^{}` matters; without it an annotated tag gives you the tag object's
# SHA, not the commit's, and the policy check rejects it).
#
# Every checkout also sets `persist-credentials: false`. Checkout otherwise
# leaves GITHUB_TOKEN in git config for the rest of the job, and all three jobs
# then run `npm ci`, which executes dependency lifecycle scripts — a
# compromised one could run authenticated git commands against this repo. No
# job here needs git after checkout (no pushes, no tags, no submodules, and no
# git-sourced npm dependencies), so nothing pays for the hardening. Adding a
# step that DOES need git auth means opting that one job back in, not dropping
# this line everywhere.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test & coverage
        run: npm run coverage:check

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser download (~170MB). The uncached path has stalled on
      # CDN/apt slowness for 10+ minutes; on a hit only the apt deps install
      # runs, which is seconds when mirrors are healthy.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: SeatMap component tests
        run: npm run test:browser

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Authenticated flows (sign-in, the admin role gate, publish) against a
  # throwaway local Supabase stack. Separate from `e2e` so the fast, Docker-free
  # smoke tier still reports on its own, and so a Docker hiccup here can never
  # be mistaken for an app failure there.
  e2e-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same browser cache as the e2e job (see comment there).
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Applies supabase/migrations/* then supabase/seed.sql. Deliberately
      # `start` and never `db reset`: a reset gives the containers new IPs while
      # Kong keeps the old ones cached, which surfaces as a 502 from the auth
      # endpoint and looks like a broken login rather than stale routing.
      # Only the containers the auth suite touches: db, gotrue (auth), kong
      # (API gateway), postgrest, mailpit (SMTP is configured, so gotrue's
      # email paths need a sink). Everything else — studio, analytics
      # (logflare+vector, the slowest to boot), storage, realtime,
      # edge-runtime, imgproxy, postgres-meta, supavisor — is excluded; the
      # app uses none of them (no .storage/.channel/functions.invoke calls).
      - name: Start local Supabase stack
        run: npx supabase start -x studio,postgres-meta,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Wait for the auth endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')/auth/v1/health"; then
              echo "auth ready"; exit 0
            fi
            sleep 5
          done
          echo "auth endpoint never became ready"; exit 1

      # No build step: playwright-auth.config.ts builds the app itself with the
      # local stack's env. NEXT_PUBLIC_* is inlined at build time, so a build
      # made anywhere else would ship a bundle pointing at the wrong project.
      - name: Run authenticated e2e tests
        run: npm run test:e2e:auth

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-auth
          path: playwright-report/
          retention-days: 7
