name: CI

# Pull requests only. The `push: [main]` trigger used to re-run the whole suite
# after every merge, which doubled the billed minutes for no new information:
# merges are squashes of a branch this workflow had just tested against an
# up-to-date main, so the second run re-tested an identical tree. Actions
# minutes are metered on this private repo, and a full run bills roughly 7.6
# minutes across the three jobs (they run in parallel, but billing sums per job).
#
# The trade, stated plainly: a commit pushed straight to main now gets no CI at
# all. Branch protection would normally prevent that, but it is unavailable here
# — GitHub reserves it for Pro on private repositories — so the only thing
# keeping main tested is the convention that every change goes through a PR.
# If that convention slips, or if the repo moves to a plan with branch
# protection and it is NOT configured, restore `push: branches: [main]`.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test & coverage
        run: npm run coverage:check

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: SeatMap component tests
        run: npm run test:browser

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Authenticated flows (sign-in, the admin role gate, publish) against a
  # throwaway local Supabase stack. Separate from `e2e` so the fast, Docker-free
  # smoke tier still reports on its own, and so a Docker hiccup here can never
  # be mistaken for an app failure there.
  e2e-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Applies supabase/migrations/* then supabase/seed.sql. Deliberately
      # `start` and never `db reset`: a reset gives the containers new IPs while
      # Kong keeps the old ones cached, which surfaces as a 502 from the auth
      # endpoint and looks like a broken login rather than stale routing.
      - name: Start local Supabase stack
        run: npx supabase start

      - name: Wait for the auth endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')/auth/v1/health"; then
              echo "auth ready"; exit 0
            fi
            sleep 5
          done
          echo "auth endpoint never became ready"; exit 1

      # No build step: playwright-auth.config.ts builds the app itself with the
      # local stack's env. NEXT_PUBLIC_* is inlined at build time, so a build
      # made anywhere else would ship a bundle pointing at the wrong project.
      - name: Run authenticated e2e tests
        run: npm run test:e2e:auth

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth
          path: playwright-report/
          retention-days: 7
