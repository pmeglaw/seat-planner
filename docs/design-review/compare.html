<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design polish — before / after</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 64px;
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #f3f4f6; color: #1f2225;
  }
  @media (prefers-color-scheme: dark) { body { background: #14171a; color: #e7e9eb; } .card { background: #1f2225 !important; border-color: #303437 !important; } .cap { color: #9aa0a6 !important; } h1 small { color: #9aa0a6 !important; } }
  header.page { max-width: 1200px; margin: 0 auto 28px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
  h1 small { display:block; font-weight: 500; font-size: 14px; color: #6b7177; margin-top: 6px; }
  h2 { max-width: 1200px; margin: 40px auto 14px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: #b2430f; }
  .pair { max-width: 1200px; margin: 0 auto 26px; }
  .pair .cap { font-weight: 600; margin: 0 0 4px; }
  .pair .note { color: #6b7177; margin: 0 0 12px; font-size: 13.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #d2d6da; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,18,20,.05), 0 10px 28px -10px rgba(15,18,20,.12); }
  .card .tag { font: 600 11px/1 -apple-system, sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid #e4e6e8; }
  .card.before .tag { color: #6b7177; }
  .card.after .tag { color: #2f7a56; }
  .card img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<header class="page">
  <h1>Office Seat Planner — design polish
    <small>Branch <code>design-polish</code> · before (left) vs after (right). Depth &amp; elevation, stronger map highlights, motion, and surface separation. Styling only — no behavior, auth, or data changes.</small>
  </h1>
</header>
<div id="root"></div>
<script>
const groups = [
  ["Viewer ( / )", [
    ["viewer-desktop", "Landing — desktop", "Stat tiles gain status accent bars + dots; page/panels get subtle separation."],
    ["viewer-desktop-seat-selected", "Seat selected — desktop", "Selected pill + detail panel."],
    ["viewer-desktop-search", "Search “north” — desktop", "Matched pills now read as strong teal with a halo; non-matches dim."],
    ["viewer-mobile", "Landing — mobile", "Stacked layout, accent tiles."],
    ["viewer-mobile-map", "Map — mobile", "Scrolled map view."],
  ]],
  ["Admin ( /admin )", [
    ["admin-desktop", "Planning canvas — desktop", "Top bar gains a floor shadow + chrome gradient; map sits in a recessed well."],
    ["admin-desktop-inspector", "Seat inspector — desktop", "Floating inspector rides a deeper elevation-3 shadow."],
    ["admin-desktop-move-mode", "Move Seat mode", "Move-origin styling + helper text (unchanged behavior)."],
    ["admin-desktop-addseat-mode", "Add Seat mode", "Mode card enters with a motion-safe animation; deeper shadow."],
    ["admin-desktop-filters", "Filters panel", "Now hugs its content instead of a tall near-empty slab; select hover states."],
    ["admin-desktop-askplanner-highlights", "Ask Planner highlights", "The key fix: 7 highlighted seats read as strong teal; all others dim for figure-ground."],
    ["admin-settings", "Settings / Advanced recovery", "Recovery cards get elevation; rows lift on hover."],
    ["admin-mobile", "Planning canvas — mobile", "Chrome + map at 500px."],
    ["admin-mobile-sheet", "Bottom-sheet inspector — mobile", "Deeper sheet shadow. (Auto-pan off the covered seat is a deferred behavioral item.)"],
  ]],
  ["Login ( /login )", [
    ["login-desktop", "Login — desktop", "Unchanged (auth untouched); shown for completeness."],
    ["login-mobile", "Login — mobile", "Unchanged."],
  ]],
];
const root = document.getElementById("root");
for (const [title, items] of groups) {
  const h = document.createElement("h2"); h.textContent = title; root.appendChild(h);
  for (const [name, cap, note] of items) {
    const wrap = document.createElement("div"); wrap.className = "pair";
    wrap.innerHTML =
      '<p class="cap">' + cap + '</p><p class="note">' + note + '</p>' +
      '<div class="grid">' +
      '<figure class="card before" style="margin:0"><div class="tag">Before</div><img loading="lazy" src="before/' + name + '.png" alt="before ' + name + '"></figure>' +
      '<figure class="card after" style="margin:0"><div class="tag">After</div><img loading="lazy" src="after/' + name + '.png" alt="after ' + name + '"></figure>' +
      '</div>';
    root.appendChild(wrap);
  }
}
</script>
</body>
</html>
